<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>도깨비 소녀와 함께 — 웹 프로토타입</title>
<style>
  :root{
    --ink:#f2ecff; --dim:#a99ec4;
    --bg0:#0b0916; --bg1:#151129; --bg2:#1e1838; --bg3:#2a2148;
    --line:#42356b; --gold:#f3c04b; --gold2:#8a6a1c;
    --red:#e2543f; --jade:#4fd6a8; --violet:#a97ce8; --cyan:#5fd3f0; --pink:#f07ab0;
    --N:#9a92ad; --R:#5fa9f0; --SR:#b07ce8; --SSR:#f3c04b; --UR:#f0607a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:#05040a; color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    font-size:13px; line-height:1.4; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    position:relative; width:100%; max-width:430px; height:100vh; max-height:930px;
    background:var(--bg0); overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 60px #000;
  }

  /* ══ 상단 HUD ══════════════════════════════════════════ */
  #hud{position:relative; z-index:30; padding:6px 8px 4px;
       background:linear-gradient(180deg,#100c22 60%,#100c2200)}
  .hrow{display:flex; align-items:center; gap:5px}
  .plate{display:flex; align-items:center; gap:6px; background:#0009; border:1px solid var(--line);
         border-radius:14px; padding:2px 8px 2px 3px}
  .pfp{width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1px solid var(--gold);
       display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden}
  .lvtag{font-size:10px;color:var(--gold);font-weight:700}
  .expbar{width:56px;height:4px;background:#000;border-radius:2px;overflow:hidden}
  .expbar>i{display:block;height:100%;background:linear-gradient(90deg,#5fd3f0,#a97ce8)}
  .cp{margin-left:auto; display:flex; align-items:center; gap:4px; background:#0009;
      border:1px solid var(--gold2); border-radius:12px; padding:2px 9px; font-weight:800; color:var(--gold)}
  #curr{display:flex; gap:4px; margin-top:4px}
  .cz{flex:1; display:flex; align-items:center; gap:3px; justify-content:center;
      background:#0009; border:1px solid var(--line); border-radius:11px; padding:2px 4px; min-width:0}
  .cz b{font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* ══ 화면 스택 ═════════════════════════════════════════ */
  #screen{position:absolute; inset:0; z-index:1}
  .scr{position:absolute; inset:0; display:none}
  .scr.on{display:block}

  /* ── 로비 배경 ── */
  #lobbyBg{position:absolute;inset:0;
    background:
      radial-gradient(90% 55% at 50% 8%, #3b2f6b 0%, #1a1433 45%, #0b0916 100%);}
  .stars{position:absolute;inset:0;opacity:.7}
  .moon{position:absolute; top:52px; right:34px; width:74px; height:74px; border-radius:50%;
        background:radial-gradient(circle at 35% 32%, #fff8dc, #f0dfa0 55%, #d8c27a);
        box-shadow:0 0 44px #f5e6b055, 0 0 90px #f5e6b022}
  .hillA,.hillB{position:absolute; left:-10%; width:120%; bottom:0}
  .lantern{position:absolute; width:16px;height:22px;border-radius:8px 8px 6px 6px;
     background:linear-gradient(180deg,#f26a5a,#c1372a); box-shadow:0 0 18px #ff7a5a88;
     animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* ── 좌우 레일 ── */
  .rail{position:absolute; top:74px; z-index:20; display:flex; flex-direction:column; gap:5px}
  .rail.l{left:5px} .rail.r{right:5px}
  .ric{width:46px; height:44px; border-radius:11px; background:linear-gradient(180deg,#2b2350cc,#171132dd);
    border:1px solid var(--line); display:flex; flex-direction:column; align-items:center;
    justify-content:center; cursor:pointer; position:relative; backdrop-filter:blur(2px)}
  .ric:active{transform:scale(.94)}
  .ric .i{font-size:17px; line-height:1}
  .ric .t{font-size:8.5px; color:var(--dim); margin-top:1px; letter-spacing:-.03em}
  .ric.hot{border-color:var(--gold); box-shadow:0 0 10px #f3c04b44}
  .dot{position:absolute; top:-3px; right:-3px; min-width:15px; height:15px; border-radius:8px;
    background:var(--red); color:#fff; font-size:9px; font-weight:800; display:flex;
    align-items:center; justify-content:center; padding:0 4px; border:1px solid #0008}

  /* ── 로비 중앙 ── */
  #hero{position:absolute; left:0; right:0; top:96px; bottom:126px;
        display:flex; align-items:center; justify-content:center; z-index:5}
  #hero svg{height:100%; max-height:400px; filter:drop-shadow(0 14px 24px #0009)}
  #heroName{position:absolute; bottom:118px; left:0; right:0; text-align:center; z-index:12}
  #heroName .nm{font-size:16px; font-weight:800; letter-spacing:.02em;
      text-shadow:0 2px 6px #000, 0 0 18px #a97ce866}
  #heroName .sub{font-size:10px; color:var(--dim)}
  #banner{position:absolute; bottom:88px; left:50%; transform:translateX(-50%); z-index:12;
    background:linear-gradient(180deg,#3a2c5e,#241b42); border:1px solid var(--gold2);
    border-radius:13px; padding:4px 16px; font-size:11px; font-weight:700; color:var(--gold);
    cursor:pointer; white-space:nowrap; box-shadow:0 0 14px #f3c04b22}
  #chat{position:absolute; bottom:66px; left:8px; right:8px; z-index:12; display:flex; gap:5px;
    align-items:center; font-size:10px; color:#cfc4e6; background:#0007; border-radius:10px;
    padding:3px 8px; overflow:hidden; white-space:nowrap}
  #chat .w{color:var(--jade); font-weight:700}
  #srv{position:absolute; bottom:66px; right:8px; z-index:13; font-size:9px; color:#6d6288}

  /* ── 하단 독 ── */
  #dock{position:absolute; bottom:0; left:0; right:0; z-index:25; display:flex;
    background:linear-gradient(180deg,#1a1433ee,#0d0a1cff); border-top:1px solid var(--line);
    padding:5px 3px calc(5px + env(safe-area-inset-bottom))}
  .dk{flex:1; text-align:center; cursor:pointer; padding:3px 0; border-radius:9px; position:relative}
  .dk .i{font-size:19px; line-height:1.1; display:block}
  .dk .t{font-size:9px; color:var(--dim)}
  .dk.on{background:#2a2148} .dk.on .t{color:var(--gold)}

  /* ══ 전투 화면 ═════════════════════════════════════════ */
  #field{position:absolute; inset:0; overflow:hidden;
    background:linear-gradient(180deg,#241c46 0%,#3a2a5c 42%,#4a2f52 62%,#2a1c33 100%)}
  .fx-far,.fx-mid{position:absolute; left:0; right:0; bottom:0}
  .bmoon{position:absolute; top:210px; right:40px; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 36% 32%,#fff6d8,#efdca2 58%,#d6bf78);
    box-shadow:0 0 40px #f5e6b055, 0 0 90px #f5e6b022}
  .fog{position:absolute; left:0; right:0; bottom:250px; height:110px; pointer-events:none;
    background:linear-gradient(180deg,#a98ce000 0%,#a98ce022 55%,#a98ce000 100%)}
  #ground{position:absolute; left:0; right:0; bottom:0; height:300px;
    background:linear-gradient(180deg,#553a63 0%,#3a2544 26%,#241730 62%,#160e1e 100%);
    border-top:2px solid #7a5588}
  #ground::after{content:""; position:absolute; left:0; right:0; top:0; height:30px;
    background:linear-gradient(180deg,#8a63a0aa,#8a63a000)}
  #actors{position:absolute; inset:0}
  .actor{position:absolute; bottom:270px; width:78px; transition:left .12s linear}
  .actor svg{width:100%; display:block}
  .actor.mob{bottom:264px; width:72px}
  .actor.boss{width:180px; bottom:250px}
  .actor.hurt{animation:hit .18s}
  @keyframes hit{0%{filter:brightness(3) saturate(0)}100%{filter:none}}
  .atkpose{animation:lunge .3s ease-out}
  @keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(12px)}100%{transform:translateX(0)}}
  .mhp{position:absolute; top:-8px; left:8px; right:8px; height:4px; background:#000a;
    border-radius:2px; overflow:hidden; border:1px solid #0008}
  .mhp>i{display:block; height:100%; background:linear-gradient(90deg,#ff6a4d,#ffb36a)}

  .dmg{position:absolute; pointer-events:none; font-weight:900; white-space:nowrap;
    animation:pop 1s cubic-bezier(.2,.9,.3,1) forwards; text-shadow:0 2px 0 #000,0 0 10px #0008; z-index:12}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.5)}
    18%{opacity:1;transform:translate(-50%,-16px) scale(1.25)}
    32%{transform:translate(-50%,-20px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-64px) scale(.95)}}
  .dmg.n{color:#fff; font-size:15px}
  .dmg.c{color:#ffd84d; font-size:21px; -webkit-text-stroke:.6px #7a4a00}
  .dmg.s{color:#c79bff; font-size:19px}
  .tagfx{position:absolute; z-index:13; pointer-events:none; font-weight:900; font-style:italic;
    letter-spacing:-.02em; animation:tag 1.1s ease-out forwards; text-shadow:0 2px 0 #000}
  @keyframes tag{0%{opacity:0;transform:translate(-50%,10px) scale(.6) rotate(-8deg)}
    20%{opacity:1;transform:translate(-50%,0) scale(1.1) rotate(-8deg)}
    100%{opacity:0;transform:translate(-50%,-30px) scale(1) rotate(-8deg)}}

  #btop{position:absolute; top:64px; left:0; right:0; z-index:20; padding:6px 8px}
  #stageTag{display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px}
  #stageTag b{color:var(--gold); font-weight:800}
  #waveBar{margin:4px auto 0; width:70%; height:6px; background:#0009; border:1px solid var(--line);
    border-radius:4px; overflow:hidden}
  #waveBar>i{display:block; height:100%; background:linear-gradient(90deg,#f3c04b,#ffe9a8)}
  #combo{position:absolute; top:120px; left:10px; z-index:20; font-weight:900; font-style:italic;
    color:var(--gold); text-shadow:0 2px 0 #000; opacity:0; transition:opacity .2s}
  #combo.on{opacity:1}
  #combo span{font-size:22px}

  /* 보스 배너 */
  #bossBar{position:absolute; top:98px; left:8px; right:8px; z-index:20; display:none}
  #bossBar.on{display:block}
  .bossName{text-align:center; font-size:12px; font-weight:800; color:#ffd9d0;
    background:linear-gradient(180deg,#7a2432,#4a1420); border:1px solid #b5566a;
    border-radius:10px; padding:2px 0; box-shadow:0 0 14px #ff536644}
  .bossHp{margin-top:3px; height:14px; background:#0b0610; border:1px solid #b5566a;
    border-radius:7px; overflow:hidden; position:relative}
  .bossHp>i{display:block; height:100%; background:linear-gradient(90deg,#ff4d5e,#ff9a6a); transition:width .12s}
  .bossHp>span{position:absolute; inset:0; text-align:center; font-size:10px; line-height:12px; font-weight:700}
  .bossTime{position:absolute; right:4px; top:18px; font-size:11px; font-weight:800; color:var(--gold);
    background:#000b; border:1px solid var(--gold2); border-radius:9px; padding:1px 7px}

  /* 기여도 랭킹 4칸 */
  #contrib{position:absolute; top:146px; left:8px; right:8px; z-index:20; display:none; gap:4px}
  #contrib.on{display:flex}
  .cbox{flex:1; background:linear-gradient(180deg,#2b2350dd,#171132ee); border:1px solid var(--line);
    border-radius:8px; padding:2px 3px; text-align:center; min-width:0}
  .cbox .r{font-size:8.5px; color:var(--gold)}
  .cbox .n{font-size:9px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cbox .v{font-size:10px; font-weight:800}

  /* 스킬 독 */
  #skills{position:absolute; bottom:68px; left:56px; right:56px; z-index:22;
    display:flex; gap:5px; justify-content:center; padding:0 2px}
  .sk{width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#3a2d63,#161029);
    border:2px solid var(--line); position:relative; cursor:pointer; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:19px}
  .sk.ready{border-color:var(--gold); box-shadow:0 0 12px #f3c04b66}
  .sk .cool{position:absolute; inset:0; background:#000a;
    transform-origin:center bottom}
  .sk .lbl{position:absolute; bottom:-1px; left:0; right:0; text-align:center; font-size:8px;
    color:var(--dim); background:#000a}
  .sk:active{transform:scale(.92)}
  #autoTog{position:absolute; bottom:70px; left:6px; z-index:23; width:42px; height:42px; border-radius:9px;
    background:#0009; border:1px solid var(--line); color:var(--dim); font-size:10px; font-weight:800;
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer}
  #autoTog.on{border-color:var(--jade); color:var(--jade); box-shadow:0 0 10px #4fd6a844}
  #leaveBtn{position:absolute; bottom:70px; right:6px; z-index:23; width:42px; height:42px; border-radius:9px;
    background:#0009; border:1px solid var(--line); color:var(--dim); font-size:10px; font-weight:800;
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer}

  /* ══ 영지 ═════════════════════════════════════════════ */
  #townMap{position:absolute; inset:0; background:
    linear-gradient(180deg,#2c4a3a 0%,#1e3a2e 40%,#16281f 100%)}
  .bldg{position:absolute; text-align:center; cursor:pointer; transition:transform .12s}
  .bldg:active{transform:scale(.95)}
  .bldg .cap{margin-top:-4px; font-size:9.5px; background:#000a; border:1px solid var(--line);
    border-radius:8px; padding:1px 6px; display:inline-block}
  .bldg .cap b{color:var(--gold)}

  /* ══ 공용 패널/모달 ═══════════════════════════════════ */
  #sheet{position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
    background:linear-gradient(180deg,#120e24f2,#0b0916fa); backdrop-filter:blur(3px)}
  #sheet.on{display:flex}
  #shTop{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line)}
  #shTop h2{margin:0; font-size:15px; color:var(--gold); flex:1}
  #shBody{flex:1; overflow-y:auto; padding:10px}
  #shTabs{display:flex; gap:4px; padding:0 8px 8px; overflow-x:auto}
  .stab{flex:0 0 auto; padding:5px 12px; border-radius:14px; background:#0007; border:1px solid var(--line);
    font-size:11px; color:var(--dim); cursor:pointer}
  .stab.on{border-color:var(--gold); color:var(--gold); background:#2a2148}

  .card{background:linear-gradient(180deg,#1f1940,#171230); border:1px solid var(--line);
    border-radius:11px; padding:9px; margin-bottom:7px}
  .row{display:flex; align-items:center; gap:8px}
  .grow{flex:1; min-width:0}
  .muted{color:var(--dim); font-size:11px}
  h3{margin:0 0 7px; font-size:12px; color:var(--gold); letter-spacing:.03em}
  .sep{height:1px; background:var(--line); margin:7px 0}
  .btn{background:linear-gradient(180deg,#332a5c,#1d1738); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:7px 11px; font-size:11.5px; cursor:pointer; white-space:nowrap; font-weight:600}
  .btn.p{background:linear-gradient(180deg,#e0b24a,#9a7420); border-color:#f0cd6e; color:#241a04}
  .btn.g{background:linear-gradient(180deg,#3fc79a,#1d7c5e); border-color:#63e0b6; color:#04241a}
  .btn.r{background:linear-gradient(180deg,#e2543f,#8e2b1c); border-color:#f08a72; color:#fff}
  .btn:disabled{opacity:.35; cursor:default}
  .bar{height:7px; background:#0b0814; border-radius:4px; overflow:hidden; border:1px solid var(--line)}
  .bar>i{display:block; height:100%; background:linear-gradient(90deg,#a97ce8,#5fd3f0)}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .slot{background:linear-gradient(180deg,#241d47,#141029); border:2px solid var(--line);
    border-radius:10px; padding:4px 2px; text-align:center; cursor:pointer; position:relative; overflow:hidden}
  .slot.N{border-color:var(--N)} .slot.R{border-color:var(--R)}
  .slot.SR{border-color:var(--SR)} .slot.SSR{border-color:var(--SSR); box-shadow:0 0 10px #f3c04b44}
  .slot.lock{opacity:.32; filter:grayscale(1)}
  .slot.eq::after{content:"편성"; position:absolute; top:0; right:0; background:var(--jade); color:#04241a;
    font-size:8px; font-weight:800; padding:0 4px; border-radius:0 0 0 6px}
  .slot .av{height:52px; display:flex; align-items:flex-end; justify-content:center}
  .slot .av svg{height:56px; margin-bottom:-4px}
  .slot .nm{font-size:10px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .slot .st{font-size:9px; color:var(--gold); letter-spacing:-1.5px}
  .rz{display:inline-block; font-size:9px; padding:0 5px; border-radius:8px; font-weight:800;
    border:1px solid currentColor}

  #toast{position:absolute; bottom:120px; left:50%; transform:translateX(-50%); z-index:60;
    background:#000d; border:1px solid var(--line); color:#fff; padding:7px 14px; border-radius:18px;
    font-size:12px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%}
  #toast.on{opacity:1}
  #modal{position:absolute; inset:0; z-index:70; background:#000c; display:none;
    align-items:center; justify-content:center; padding:14px}
  #modal.on{display:flex}
  #mbox{background:linear-gradient(180deg,#251d49,#15102c); border:1px solid var(--gold2);
    border-radius:14px; padding:14px; width:100%; max-height:78%; overflow-y:auto;
    box-shadow:0 0 30px #0009}

  /* 낚시 미니게임 */
  #fishGame{text-align:center}
  #fishTrack{position:relative; height:16px; background:#0b0814; border:1px solid var(--line);
    border-radius:8px; overflow:hidden; margin:8px 0}
  #fishZone{position:absolute; top:0; bottom:0; background:#4fd6a855; border-left:1px solid var(--jade);
    border-right:1px solid var(--jade)}
  #fishPin{position:absolute; top:0; bottom:0; width:3px; background:var(--gold); box-shadow:0 0 8px var(--gold)}
</style>
</head>
<body>
<div id="app">

  <!-- ══ 화면 스택 ══ -->
  <div id="screen">
    <!-- 로비 -->
    <div class="scr on" id="scrLobby">
      <div id="lobbyBg">
        <svg class="stars" viewBox="0 0 100 100" preserveAspectRatio="none"><g fill="#fff"></g></svg>
        <div class="moon"></div>
        <svg class="hillA" viewBox="0 0 100 30" preserveAspectRatio="none" style="height:150px">
          <path d="M0 30 L0 16 Q14 6 28 14 Q42 22 56 10 Q72 0 86 12 Q94 18 100 14 L100 30 Z" fill="#251c46"/>
        </svg>
        <svg class="hillB" viewBox="0 0 100 22" preserveAspectRatio="none" style="height:96px">
          <path d="M0 22 L0 12 Q18 4 34 12 Q50 20 66 11 Q84 2 100 10 L100 22 Z" fill="#160f2e"/>
        </svg>
        <svg class="hillB" viewBox="0 0 200 60" preserveAspectRatio="none" style="height:110px;opacity:.9">
          <!-- 한옥 실루엣 -->
          <path d="M20 60 L20 40 L40 40 L40 60 Z" fill="#0e0a1e"/>
          <path d="M10 40 Q30 24 50 40 Z" fill="#0e0a1e"/>
          <path d="M150 60 L150 44 L176 44 L176 60 Z" fill="#0e0a1e"/>
          <path d="M142 44 Q163 28 184 44 Z" fill="#0e0a1e"/>
        </svg>
        <div class="lantern" style="left:30px;top:150px"></div>
        <div class="lantern" style="right:44px;top:196px;animation-delay:.8s"></div>
      </div>

      <div id="hero"></div>
      <div id="heroName"><div class="nm" id="hName">—</div><div class="sub" id="hSub">—</div></div>
      <div id="banner">⚔ 도전 · 골드 던전</div>
      <div id="chat"><span class="w">[세계]</span><span id="chatMsg">—</span></div>
      <div id="srv">#21011:1</div>

      <div class="rail l" id="railL"></div>
      <div class="rail r" id="railR"></div>
    </div>

    <!-- 전투 -->
    <div class="scr" id="scrBattle">
      <div id="field">
        <div class="bmoon"></div>
        <svg class="fx-far" viewBox="0 0 100 40" preserveAspectRatio="none" style="height:230px;opacity:.5;bottom:290px">
          <path d="M0 40 L0 20 Q16 6 32 18 Q48 30 64 14 Q82 0 100 16 L100 40 Z" fill="#241a45"/>
        </svg>
        <svg class="fx-mid" viewBox="0 0 200 40" preserveAspectRatio="none" style="height:150px;opacity:.95;bottom:292px">
          <path d="M0 40 L0 26 Q22 14 42 24 Q60 33 78 22 Q92 14 104 22 Q124 33 146 22 Q170 10 200 22 L200 40 Z" fill="#1a1130"/>
          <path d="M24 26 L24 12 L44 12 L44 26 Z" fill="#150d28"/><path d="M14 12 Q34 -1 54 12 Z" fill="#150d28"/>
          <path d="M150 26 L150 15 L172 15 L172 26 Z" fill="#150d28"/><path d="M141 15 Q161 2 181 15 Z" fill="#150d28"/>
        </svg>

function fmt(n){

  let i = 0; let v = n;
  while(v >= 1000 && i < UNIT.length-1){ v /= 1000; i++; }
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + UNIT[i];

/* ── 스탯 ─────────────────────────────────────────────────── */
function cpow(id){
  const c = CHARS[id], o = S.own[id];
  const m = (1 + .20*(o.star-1)) * (1 + .05*o.aff);
  return {atk:c.atk*m, hp:c.hp*m, mul:m};
}
const ESS_MUL = 1.18;
const essMult = n => Math.pow(ESS_MUL, n);
function stats(){
  let atk = 10, hp = 100, atkp = 0;
  let crit = .05, critdmg = 2.0, gold = 1, boss = 1, cdr = 0, forge = 0;
  for(const e of EQUIP){ const l = S.equip[e.id]; atk += e.atk*l; hp += e.hp*l; }
  for(const id of S.party){
    if(!id || !S.own[id].have) continue;
    const p = cpow(id); atk += p.atk; hp += p.hp;
    const b = CHARS[id].b; if(!b) continue;
    const v = b.v * p.mul;
    if(b.t==='crit') crit += v; else if(b.t==='critdmg') critdmg += v;
    else if(b.t==='gold') gold += v; else if(b.t==='boss') boss += v;
    else if(b.t==='cdr') cdr += Math.min(.5,v); else if(b.t==='atkp') atkp += v;
    else if(b.t==='forge') forge += Math.min(.5,v);
  }
  atk *= (1 + atkp);
  atk *= essMult(S.essence);
  atk *= (1 + .04*(S.plv-1));
  const dps = atk * (1 + crit*(critdmg-1));
  return {atk, hp, crit, critdmg, gold, boss, cdr, forge, dps, cp:Math.floor(dps*3 + hp)};
}

/* ── 전투 수치 (1차에서 시뮬로 검증한 값 유지) ─────────────── */
const isBoss  = st => st % 10 === 0;
const mobHp   = st => 60 * Math.pow(1.13, st-1) * (isBoss(st) ? 8 : 1);
const mobGold = st => 14 * Math.pow(1.15, st-1) * (isBoss(st) ? 10 : 1);
const zoneIdx = st => Math.floor((st-1)/10);
const zoneName= st => zoneIdx(st) < ZONES.length ? ZONES[zoneIdx(st)] : '무저갱 ' + (zoneIdx(st)-ZONES.length+1) + '심';
const mobKind = st => MOBS[Math.min(MOBS.length-1, zoneIdx(st))];

/* ══════════════════════════════════════════════════════════
   전투 엔진 — 사이드뷰. 파티 4명은 고정 위치, 몬스터는 우측에서
   걸어 들어와 근접하면 멈추고 서로 때린다.
   ══════════════════════════════════════════════════════════ */
let MODE = 'lobby';            // lobby | battle | boss | town
let AUTO = true;
const B = {mobs:[], cd:{}, combo:0, comboT:0, timer:0, wave:0, boss:null, contrib:null, respawn:0};
const PARTY_X = [6, 18, 30, 42];

function partyIds(){ return S.party.filter(id => id && S.own[id].have); }

function enterBattle(bossMode){
  MODE = bossMode ? 'boss' : 'battle';
  B.mobs = []; B.combo = 0; B.wave = 0; B.boss = null; B.respawn = 0;
  B.cd = {}; partyIds().forEach(id => B.cd[id] = CHARS[id].sk.cd * .5);
  if(bossMode){
    const hp = Math.max(stats().dps * 30 * 1.6, 1000);
    B.boss = {name:BOSSNAMES[S.rebirths % BOSSNAMES.length], hp, max:hp, dmg:0, lv:30+S.rebirths*5};
    B.timer = 60;
    B.contrib = ['모라','배드도사','모짱','인재:피프'].map((n,i) => ({n, v: Math.max(S.bossBest,stats().dps*30)*(1.9-i*.35)}));
    $('#bossBar').classList.add('on'); $('#contrib').classList.add('on');
  }else{
    $('#bossBar').classList.remove('on'); $('#contrib').classList.remove('on');
    spawnWave();
  }
  showScreen('battle'); paintSkills(); paintActors(); paintBattleTop();
}
function leaveBattle(){ MODE = 'lobby'; showScreen('lobby'); save(); }

function spawnWave(){
  const k = mobKind(S.stage);
  const bossStage = isBoss(S.stage);
  const n = bossStage ? 1 : WAVE_N;
  const each = mobHp(S.stage) / n;
  for(let i=0;i<n;i++){
    B.mobs.push({hp:each, max:each, x:96 + i*12, kind:k, big:bossStage, id:Math.random().toString(36).slice(2)});
  }
  if(bossStage) B.timer = 30;
}

/* 사거리 안(=걸어 들어와 멈춘) 몬스터만 때린다.
   이걸 안 걸면 화면 밖에서 전멸해 전투가 아예 안 보인다. */
const WAVE_N = 5;                                // 한 웨이브 몬스터 수 (스테이지당 10마리 = 2웨이브)
const slotX = i => 54 + i*10;                    // i번째 몬스터가 멈춰 서는 자리
/* 자기 자리까지 걸어온 몬스터만 때린다. 이 판정을 느슨하게 잡으면
   몹이 화면 오른쪽 끝에서 즉사해 전투가 안 보인다. */
function frontMob(){ return B.mobs.find((m,i) => m.x <= slotX(i) + 0.5) || null; }
function dealDamage(amount, kind, targetIdx){
  const m = B.boss ? null : (targetIdx !== undefined ? B.mobs[targetIdx] : frontMob());
  const st = stats();
  if(isBoss(S.stage) || B.boss) amount *= st.boss;
  if(B.boss){
    B.boss.hp -= amount; B.boss.dmg += amount;
    popDamage(amount, kind, 62, 46);
    if(B.boss.hp <= 0){ B.boss.hp = 0; endWorldBoss(true); }
    return;
  }
  if(!m) return;
  m.hp -= amount;
  popDamage(amount, kind, m.x, 40);
  const el = document.querySelector('[data-m="'+m.id+'"]');
  if(el){ el.classList.remove('hurt'); void el.offsetWidth; el.classList.add('hurt'); }
  if(m.hp <= 0) killMob(m);
}
function killMob(m){
  const i = B.mobs.indexOf(m); if(i < 0) return;
  B.mobs.splice(i,1);
  const st = stats();
  const g = mobGold(S.stage) * st.gold / (isBoss(S.stage) ? 1 : WAVE_N);
  S.gold += g; S.totalKills++; gainExp(2 + S.stage*0.6);
  B.combo++; B.comboT = 2.5;
  if(B.combo >= 10 && B.combo % 10 === 0) tagFX(B.combo >= 30 ? 'OVERPOWER!' : 'CRITICAL BREAK', '#ffd84d');
  if(B.mobs.length === 0){
    if(isBoss(S.stage)){
      S.gem += 30; toast('층 보스 격파! 💎30 · 다음 층 개방');
      S.stage++; S.kills = 0;
    }else{
      S.kills += WAVE_N;
      if(S.kills >= 10){ S.kills = 0; if(AUTO) S.stage++; }
    }
    if(S.stage > S.maxStage) S.maxStage = S.stage;
    B.respawn = 0.15;        // 게임 루프가 세는 재스폰 대기 (setTimeout은 백그라운드에서 얼어붙는다)
  }
  paintActors();
}
function gainExp(v){
  S.pexp += v;
  const need = () => 40 * Math.pow(1.25, S.plv-1);
  while(S.pexp >= need()){ S.pexp -= need(); S.plv++; toast('Lv.' + S.plv + ' 달성!'); }
}

function popDamage(v, kind, xPct, yPct){
  const host = $('#actors'); if(!host) return;
  const d = document.createElement('div');
  d.className = 'dmg ' + kind;
  d.textContent = fmt(v) + (kind === 'c' ? '!' : '');
  d.style.left = xPct + '%'; d.style.top = yPct + '%';
  host.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function tagFX(text, color){
  const host = $('#actors'); if(!host) return;
  const d = document.createElement('div');
  d.className = 'tagfx'; d.textContent = text; d.style.color = color;
  d.style.left = '58%'; d.style.top = '34%'; d.style.fontSize = '17px';
  host.appendChild(d); setTimeout(() => d.remove(), 1100);
}

function castSkill(id){
  if(!B.cd[id] || B.cd[id] > 0) return false;
  if(!B.boss && !frontMob()) return false;      // 사거리 밖이면 쿨을 낭비하지 않는다
  B.cd[id] = CHARS[id].sk.cd;
  const p = cpow(id);
  dealDamage(p.atk * CHARS[id].sk.m * essMult(S.essence), 's');
  const el = document.querySelector('[data-p="'+id+'"]');
  if(el){ el.classList.remove('atkpose'); void el.offsetWidth; el.classList.add('atkpose'); }
  return true;
}
function heroSwing(){
  const st = stats();
  const c = Math.random() < st.crit;
  dealDamage(st.atk * 2.5 * (c ? st.critdmg : 1), c ? 'c' : 'n');
  const el = document.querySelector('.actor.pc');
  if(el){ el.classList.remove('atkpose'); void el.offsetWidth; el.classList.add('atkpose'); }
}

/* ── 렌더: 전투 액터 ──────────────────────────────────────── */
function paintActors(){
  const host = $('#actors');
  let h = '';
  const ids = partyIds();
  ids.forEach((id,i) => {
    h += `<div class="actor pc" data-p="${id}" style="left:${PARTY_X[i]}%;z-index:${5+i}">
            ${chibi(CHARS[id], {weapon: i===0})}</div>`;
  });
  B.mobs.forEach(m => {
    h += `<div class="actor mob${m.big?' boss':''}" data-m="${m.id}" style="left:${m.x}%;z-index:4">
            <div class="mhp"><i style="width:${Math.max(0,m.hp/m.max*100)}%"></i></div>
            ${mobSVG(m.kind, m.big)}</div>`;
  });
  if(B.boss){
    h += `<div class="actor boss" style="left:56%;z-index:3">${mobSVG(MOBS[6], true)}</div>`;
  }
  host.innerHTML = h;
}
function paintBattleTop(){
  $('#zoneNm').textContent = zoneName(S.stage);
  $('#stgNo').textContent = S.stage + '-' + (Math.floor(S.kills/WAVE_N)+1);
  $('#waveBar').firstElementChild.style.width = (S.kills/10*100) + '%';
}
function paintSkills(){
  const host = $('#skills');
  const ids = partyIds();
  let h = `<div class="sk ready" onclick="heroSwing()" title="몽둥이"><span>🏏</span><span class="lbl">강타</span></div>`;
  ids.forEach(id => {
    h += `<div class="sk" data-sk="${id}" onclick="castSkill('${id}')">
      <span>${CHARS[id].sk.i}</span><div class="cool"></div><span class="lbl">${CHARS[id].n}</span></div>`;
  });
  host.innerHTML = h;
}
function paintCooldowns(){
  document.querySelectorAll('[data-sk]').forEach(el => {
    const id = el.dataset.sk, c = B.cd[id];
    const cd = CHARS[id].sk.cd;
    const ratio = Math.max(0, Math.min(1, c/cd));
    const cool = el.querySelector('.cool');
    if(cool) cool.style.transform = 'scaleY(' + ratio + ')';
    el.classList.toggle('ready', ratio <= 0);
  });
}

/* ── 메인 루프 ────────────────────────────────────────────── */
let last = performance.now(), acc = 0, sacc = 0;
function loop(now){
  const dt = Math.min(.25, (now-last)/1000); last = now;
  const st = stats();

  if(MODE === 'battle' || MODE === 'boss'){
    // 웨이브 재스폰
    if(B.respawn > 0){
      B.respawn -= dt;
      if(B.respawn <= 0 && MODE === 'battle'){ spawnWave(); paintActors(); paintBattleTop(); }
    }
    // 몬스터 전진
    let moved = false;
    B.mobs.forEach((m,i) => {
      const target = slotX(i);
      if(m.x > target){ m.x = Math.max(target, m.x - 55*dt); moved = true; }
    });
    if(moved){
      B.mobs.forEach(m => {
        const el = document.querySelector('[data-m="'+m.id+'"]');
        if(el) el.style.left = m.x + '%';
      });
    }
    // 자동 평타 — 접전 중일 때만.
    // 매 프레임 때리면 한 대가 소수점이라 "0"으로 찍힌다. 0.3초씩 모아 한 방으로 낸다.
    const engaged = B.boss || frontMob();
    if(engaged){
      B.atkT = (B.atkT || 0) + dt;
      if(B.atkT >= 0.3){
        const c = Math.random() < st.crit;
        dealDamage(st.dps * B.atkT * (c ? 1.6 : 1), c ? 'c' : 'n');
        B.atkT = 0;
        const pc = document.querySelector('.actor.pc');
        if(pc){ pc.classList.remove('atkpose'); void pc.offsetWidth; pc.classList.add('atkpose'); }
      }
    }
    // 스킬 쿨 + 자동 시전
    for(const id of partyIds()){
      B.cd[id] -= dt * (1 + st.cdr);
      if(B.cd[id] <= 0 && AUTO && engaged) castSkill(id);
    }
    paintCooldowns();
    // 콤보 유지
    if(B.comboT > 0){ B.comboT -= dt; if(B.comboT <= 0) B.combo = 0; }
    const cel = $('#combo');
    cel.classList.toggle('on', B.combo >= 3);
    $('#comboN').textContent = B.combo;
    // 보스 타이머
    if(MODE === 'boss' && B.boss){
      B.timer -= dt;
      $('#bHpFill').style.width = (B.boss.hp/B.boss.max*100) + '%';
      $('#bHpTxt').textContent = fmt(B.boss.hp) + ' / ' + fmt(B.boss.max);
      $('#bTime').textContent = '⏱ 00:' + String(Math.max(0,Math.ceil(B.timer))).padStart(2,'0');
      paintContrib();
      if(B.timer <= 0) endWorldBoss(false);
    }else if(isBoss(S.stage)){
      B.timer -= dt;
      if(B.timer <= 0){ toast('제한시간 초과 — 전투력을 더 올려야 합니다'); B.mobs = []; spawnWave(); paintActors(); }
    }
  }

  for(const b of BLDG){ if(b.res) S[b.res] += b.base * S.bldg[b.id] * dt; }
  if(S.bossCool > 0) S.bossCool = Math.max(0, S.bossCool - dt);

  acc += dt; if(acc > .1){ acc = 0; paintHud(); }
  sacc += dt; if(sacc > 5){ sacc = 0; save(); }
  requestAnimationFrame(loop);
}

/* ── 월드보스 ─────────────────────────────────────────────── */
function paintContrib(){
  const rows = B.contrib.concat([{n:'나', v:B.boss.dmg, me:true}])
    .sort((a,b) => b.v-a.v).slice(0,4);
  $('#contrib').innerHTML = rows.map((r,i) =>
    `<div class="cbox"><div class="r">${i+1}위</div>
      <div class="n" style="${r.me?'color:var(--gold);font-weight:800':''}">${r.n}</div>
      <div class="v">${fmt(r.v)}</div></div>`).join('');
}
function endWorldBoss(cleared){
  const dmg = B.boss.dmg, best = dmg > S.bossBest;
  if(best) S.bossBest = dmg;
  const gem = Math.max(20, Math.min(400, Math.floor(dmg/1500)));
  S.gem += gem; S.bossCool = 90;
  B.boss = null; MODE = 'lobby';
  $('#bossBar').classList.remove('on'); $('#contrib').classList.remove('on');
  showScreen('lobby'); save();
  modal(`<h3>${cleared ? '토벌 성공!' : '토벌 종료'}</h3>
    <div class="muted">누적 피해 <b style="color:var(--gold)">${fmt(dmg)}</b>${best?' — 신기록!':''}</div>
    <div class="sep"></div><div>보상 💎${gem}</div>
    <button class="btn p" style="width:100%;margin-top:10px" onclick="closeModal()">확인</button>`);
}

/* ── 화면 전환 ────────────────────────────────────────────── */
function showScreen(s){
  ['Lobby','Battle','Town'].forEach(n =>
    $('#scr'+n).classList.toggle('on', n.toLowerCase() === (s==='boss'?'battle':s)));
  if(s === 'lobby'){ MODE = 'lobby'; paintLobby(); }
  if(s === 'town') { MODE = 'town'; paintTown(); }
  paintDock(s);
}

  {i:'🎁', t:'이벤트', a:()=>toast('진행 중인 이벤트가 없습니다'), dot:1},
  {i:'✉️', t:'우편',  a:()=>toast('우편함이 비었습니다')},
  {i:'📜', t:'퀘스트', a:()=>openSheet('quest'), dot:3},
];
const RAIL_R = [
  {i:'⚔️', t:'모험',  a:()=>enterBattle(false), hot:1},
  {i:'💠', t:'소환',  a:()=>openSheet('summon')},
  {i:'👹', t:'월드보스', a:()=>tryBoss()},
  {i:'🌀', t:'환생',  a:()=>openSheet('rebirth')},
];
function paintLobby(){
  const lead = S.party.find(id => id && S.own[id].have) || 'hongi';
  $('#hero').innerHTML = chibi(CHARS[lead], {weapon:true});
  $('#hName').textContent = CHARS[lead].n;
  $('#hSub').textContent = CHARS[lead].t + ' · ' + '★'.repeat(S.own[lead].star);
  $('#pfp').innerHTML = chibi(CHARS[lead]);
  $('#railL').innerHTML = RAIL_L.map((r,i) =>
    `<div class="ric" onclick="RAIL_L[${i}].a()">${r.dot?`<span class="dot">${r.dot}</span>`:''}
      <span class="i">${r.i}</span><span class="t">${r.t}</span></div>`).join('');
  $('#railR').innerHTML = RAIL_R.map((r,i) =>
    `<div class="ric${r.hot?' hot':''}" onclick="RAIL_R[${i}].a()">
      <span class="i">${r.i}</span><span class="t">${r.t}</span></div>`).join('');
}
let chatI = 0;
setInterval(() => { chatI = (chatI+1) % CHATS.length; const el = $('#chatMsg'); if(el) el.textContent = CHATS[chatI]; }, 4200);

/* ── 하단 독 ──────────────────────────────────────────────── */
const DOCK = [
  {id:'char',  i:'👘', t:'도깨비', a:()=>openSheet('char')},
  {id:'equip', i:'⚒️', t:'강화',   a:()=>openSheet('equip')},
  {id:'lobby', i:'🏠', t:'로비',   a:()=>showScreen('lobby')},
  {id:'battle',i:'⚔️', t:'모험',   a:()=>enterBattle(false)},
  {id:'town',  i:'🏡', t:'영지',   a:()=>showScreen('town')},
  {id:'more',  i:'☰',  t:'더보기', a:()=>openSheet('more')},
];
function paintDock(cur){
  $('#dock').innerHTML = DOCK.map((d,i) =>
    `<div class="dk${d.id===cur?' on':''}" onclick="DOCK[${i}].a()">
      <span class="i">${d.i}</span><span class="t">${d.t}</span></div>`).join('');
}

/* ── HUD ──────────────────────────────────────────────────── */
function paintHud(){
  const st = stats();
  $('#cGold').textContent = fmt(S.gold);
  $('#cGem').textContent  = fmt(S.gem);
  $('#cFish').textContent = fmt(S.fish);
  $('#cHerb').textContent = fmt(S.herb);
  $('#cEss').textContent  = S.essence;
  $('#cpv').textContent   = fmt(st.cp);
  $('#plv').textContent   = S.plv;
  $('#pexp').style.width  = (S.pexp / (40*Math.pow(1.25,S.plv-1)) * 100) + '%';
}

/* ── 영지 ─────────────────────────────────────────────────── */
function paintTown(){
  const map = $('#townMap');
  let h = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
    <path d="M0 74 Q26 66 52 74 Q76 82 100 72 L100 100 L0 100 Z" fill="#12241b"/>
    <ellipse cx="24" cy="62" rx="20" ry="9" fill="#2f6fa8" opacity=".65"/>
    <path d="M46 100 Q52 60 44 24" stroke="#3c5a44" stroke-width="6" fill="none" opacity=".7"/>
  </svg>`;
  BLDG.forEach((b,i) => {
    h += `<div class="bldg" style="left:${b.x}%;top:${b.y}%" onclick="openSheet('town')">
      <div style="font-size:38px;filter:drop-shadow(0 6px 8px #0008)">${b.e}</div>
      <div class="cap">${b.n} <b>Lv.${S.bldg[b.id]}</b></div></div>`;
  });
  h += `<div class="bldg" style="left:12%;top:80%" onclick="openFishing()">
      <div style="font-size:32px">🎣</div><div class="cap">낚시하기</div></div>`;
  map.innerHTML = h;
}

/* ── 시트(전체화면 패널) ──────────────────────────────────── */
let SHEET = null, STAB = 0;
const SHEETS = {
  char:   {title:'도깨비', tabs:['편성','도감'], render:renderChar},
  equip:  {title:'강화',   tabs:['장비'],       render:renderEquip},
  summon: {title:'소환',   tabs:['도깨비 소환'], render:renderSummon},
  town:   {title:'영지 운영', tabs:['건물'],    render:renderTown},
  rebirth:{title:'환생',   tabs:['정수'],       render:renderRebirth},
  quest:  {title:'퀘스트', tabs:['일일'],       render:renderQuest},
  attend: {title:'출석부', tabs:['7일'],        render:renderAttend},
  more:   {title:'더보기', tabs:['기록'],       render:renderMore},
};
function openSheet(k){ SHEET = k; STAB = 0; $('#sheet').classList.add('on'); paintSheet(); }
function closeSheet(){ $('#sheet').classList.remove('on'); SHEET = null; }
function paintSheet(){
  const s = SHEETS[SHEET]; if(!s) return;
  $('#shTitle').textContent = s.title;
  $('#shTabs').innerHTML = s.tabs.map((t,i) =>
    `<div class="stab${i===STAB?' on':''}" onclick="STAB=${i};paintSheet()">${t}</div>`).join('');
  const body = $('#shBody'), top = body.scrollTop;
  body.innerHTML = s.render();
  body.scrollTop = top;
}

/* 도깨비 */
function renderChar(){
  if(STAB === 0){
    const st = stats();
    let h = `<div class="card"><h3>파티 편성 (최대 4)</h3><div class="grid4">`;
    S.party.forEach((id,i) => {
      const c = id ? CHARS[id] : null;
      h += `<div class="slot ${c?c.r:''}" onclick="unslot(${i})">
        <div class="av">${c ? chibi(c) : '<div style="font-size:26px;opacity:.4;align-self:center">＋</div>'}</div>
        <div class="nm">${c?c.n:'빈 자리'}</div>
        <div class="st">${c?'★'.repeat(S.own[id].star):'&nbsp;'}</div></div>`;
    });
    h += `</div><div class="sep"></div><div class="muted">
      공격력 ${fmt(st.atk)} · 초당피해 ${fmt(st.dps)} · 체력 ${fmt(st.hp)}<br>
      치명 ${(st.crit*100).toFixed(1)}% / 치명피해 ${(st.critdmg*100).toFixed(0)}% ·
      골드 +${((st.gold-1)*100).toFixed(0)}% · 보스피해 +${((st.boss-1)*100).toFixed(0)}%<br>
      환생 배율 ×${fmt(essMult(S.essence))} · 계정 Lv.${S.plv} (+${((S.plv-1)*4)}%)</div></div>`;
    return h;
  }
  let h = `<div class="card"><h3>도감 ${CIDS.filter(i=>S.own[i].have).length}/${CIDS.length}</h3><div class="grid3">`;
  for(const id of CIDS){
    const c = CHARS[id], o = S.own[id];
    h += `<div class="slot ${c.r} ${o.have?'':'lock'} ${S.party.includes(id)?'eq':''}" onclick="openChar('${id}')">
      <div class="av">${chibi(c)}</div>
      <div class="nm">${o.have?c.n:'???'}</div>
      <div class="st">${o.have?'★'.repeat(o.star):`<span class="rz ${c.r}" style="color:var(--${c.r})">${c.r}</span>`}</div>
      ${o.sh>0?`<div class="muted" style="font-size:9px">조각 ${o.sh}</div>`:''}</div>`;
  }
  return h + `</div></div>`;
}

/* 소환 */
function rollRar(){
  const tot = Object.values(RAR).reduce((a,b)=>a+b.w,0);
  let r = Math.random()*tot;
  for(const k of ['SSR','SR','R','N']){ r -= RAR[k].w; if(r<=0) return k; }
  return 'N';
}
function renderSummon(){
  return `<div class="card"><h3>도깨비 소환</h3>
    <div class="muted">SSR 2% · SR 10% · R 28% · N 60% — 중복은 조각으로 전환됩니다.</div>
    <div class="sep"></div>
    <div class="row"><button class="btn p grow" ${S.gem>=100?'':'disabled'} onclick="doSummon(1)">1회 💎100</button>
      <button class="btn p grow" ${S.gem>=900?'':'disabled'} onclick="doSummon(10)">10연 💎900</button></div>
    <div class="muted" style="margin-top:6px">누적 소환 ${S.summons}회</div></div>
    <div class="card"><h3>정령석 수급</h3><div class="muted">
      층 보스 격파 💎30 · 월드보스 보상 · 방치 보상</div></div>`;
}
window.doSummon = n => {
  const cost = n===1 ? 100 : 900;
  if(S.gem < cost) return;
  S.gem -= cost; S.summons += n;
  const res = [];
  for(let i=0;i<n;i++){
    const rar = rollRar();
    const pool = CIDS.filter(id => CHARS[id].r === rar);
    const id = pool[Math.floor(Math.random()*pool.length)];
    const o = S.own[id];
    if(o.have){ const g = Math.ceil(RAR[rar].sh/4); o.sh += g; res.push({id,dup:true,g}); }
    else { o.have = true; res.push({id,dup:false}); }
  }
  modal(`<h3>소환 결과</h3><div class="grid3">` + res.map(r => {
    const c = CHARS[r.id];
    return `<div class="slot ${c.r}"><div class="av">${chibi(c)}</div><div class="nm">${c.n}</div>
      <div class="muted" style="font-size:9px">${r.dup?'조각 +'+r.g:'<b style="color:var(--gold)">NEW!</b>'}</div></div>`;
  }).join('') + `</div><button class="btn p" style="width:100%;margin-top:10px" onclick="closeModal()">확인</button>`);
  paintSheet();
};

  if(hit){ FISH.got += bonus; S.fish += bonus; toast('대물! 어패 +' + bonus); }

function offlineReward(){
  const dt = Math.min(8*3600, (Date.now()-S.t)/1000);
  if(dt < 60) return;
  const st = stats();
  const rate = Math.min(st.dps/mobHp(S.stage), 1.2);
  const gold = rate * mobGold(S.stage) * st.gold * dt * .6 * (1 + S.bldg.lab*.05);
  const gem = Math.floor(dt/600);
  let fish = 0, herb = 0;
  BLDG.forEach(b => { if(b.res === 'fish') fish = b.base*S.bldg[b.id]*dt;
                      if(b.res === 'herb') herb = b.base*S.bldg[b.id]*dt; });
  S.gold += gold; S.gem += gem; S.fish += fish; S.herb += herb;
  const m = Math.floor(dt/60);
  modal(`<h3>방치 보상</h3><div class="muted">${Math.floor(m/60)}시간 ${m%60}분 동안
    도깨비들이 대신 싸웠습니다.</div><div class="sep"></div>
    <div>🪙 ${fmt(gold)}<br>💎 ${gem}<br>🐟 ${fmt(fish)}<br>🌿 ${fmt(herb)}</div>
    <button class="btn p" style="width:100%;margin-top:10px" onclick="closeModal()">받기</button>`);
}
