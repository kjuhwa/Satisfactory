<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>도깨비 소녀와 함께 — 웹 프로토타입</title>
<style>
  :root{
    --bg:#14111a; --bg2:#1d1926; --bg3:#272132;
    --line:#3a3145; --ink:#ece7f2; --dim:#9a8fae;
    --red:#e2543f; --gold:#e8b04b; --jade:#4fbf9f; --violet:#9b6ce0; --blue:#5aa9e6;
    --n:#8d8698; --r:#5aa9e6; --sr:#9b6ce0; --ssr:#e8b04b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    font-size:14px; line-height:1.45;
    display:flex; justify-content:center;
    user-select:none;
  }
  #app{width:100%; max-width:460px; height:100vh; display:flex; flex-direction:column;
       background:var(--bg); border-left:1px solid var(--line); border-right:1px solid var(--line); overflow:hidden}

  /* ── 자원 바 ───────────────────────────── */
  #res{display:flex; gap:6px; padding:8px 10px; background:var(--bg2); border-bottom:1px solid var(--line); font-size:12px}
  .rz{flex:1; display:flex; align-items:center; gap:4px; justify-content:center; background:var(--bg3); border-radius:6px; padding:4px 2px; min-width:0}
  .rz i{font-style:normal; font-size:13px}
  .rz b{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* ── 전투 화면 ─────────────────────────── */
  #stage{position:relative; padding:10px; background:
      radial-gradient(120% 90% at 50% 0%, #2b2440 0%, #171320 60%, #100d16 100%);
      border-bottom:1px solid var(--line); overflow:hidden}
  #stage::after{content:""; position:absolute; inset:auto 0 0 0; height:34px;
      background:linear-gradient(180deg,transparent,#0b0910)}
  #stitle{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--dim)}
  #stitle b{color:var(--ink); font-size:15px; letter-spacing:.02em}
  #mon{margin-top:6px; position:relative; height:132px; display:flex; align-items:flex-end; justify-content:center; cursor:pointer}
  #monface{font-size:62px; line-height:1; filter:drop-shadow(0 6px 10px #0008); transition:transform .08s}
  #mon.hit #monface{transform:scale(.9) translateY(4px)}
  #hpwrap{margin-top:6px; position:relative; height:16px; background:#0d0b12; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  #hpbar{height:100%; width:100%; background:linear-gradient(90deg,#e2543f,#f08a5d); transition:width .12s linear}
  #hptxt{position:absolute; inset:0; text-align:center; font-size:11px; line-height:14px; text-shadow:0 1px 2px #000}
  #prog{margin-top:6px; display:flex; gap:3px}
  .pk{flex:1; height:5px; border-radius:3px; background:#2a2434}
  .pk.on{background:var(--gold)}
  #btmrow{display:flex; gap:6px; margin-top:8px; align-items:center}
  #tap{flex:1; background:linear-gradient(180deg,#e2543f,#a8351f); border:none; color:#fff; font-weight:700;
       padding:10px; border-radius:8px; font-size:14px; cursor:pointer; box-shadow:0 3px 0 #6d1f11}
  #tap:active{transform:translateY(2px); box-shadow:0 1px 0 #6d1f11}
  .fbtn{background:var(--bg3); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-size:12px; cursor:pointer}
  .fbtn.on{border-color:var(--jade); color:var(--jade)}
  #timer{position:absolute; top:8px; right:10px; background:#0009; color:var(--gold); padding:2px 8px; border-radius:10px; font-size:12px; font-weight:700}
  .float{position:absolute; pointer-events:none; font-weight:700; font-size:15px; animation:fl .8s ease-out forwards; text-shadow:0 2px 3px #000}
  @keyframes fl{0%{opacity:1;transform:translateY(0) scale(.9)}100%{opacity:0;transform:translateY(-52px) scale(1.15)}}
  #party{display:flex; gap:4px; margin-top:8px}
  .pslot{flex:1; background:#0009; border:1px solid var(--line); border-radius:8px; padding:4px; text-align:center; position:relative; overflow:hidden}
  .pslot .em{font-size:20px}
  .pslot .nm{font-size:9px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cdbar{position:absolute; left:0; bottom:0; height:3px; background:var(--jade)}

  /* ── 탭 ────────────────────────────────── */
  #tabs{display:flex; background:var(--bg2); border-bottom:1px solid var(--line)}
  .tab{flex:1; padding:9px 2px; text-align:center; font-size:11px; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent}
  .tab .ic{display:block; font-size:16px; line-height:1.2}
  .tab.on{color:var(--gold); border-bottom-color:var(--gold); background:#0004}
  #panel{flex:1; overflow-y:auto; padding:10px; -webkit-overflow-scrolling:touch}

  /* ── 공용 ──────────────────────────────── */
  .card{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px}
  .row{display:flex; align-items:center; gap:8px}
  .grow{flex:1; min-width:0}
  .muted{color:var(--dim); font-size:11px}
  .btn{background:var(--bg3); border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:7px 10px; font-size:12px; cursor:pointer; white-space:nowrap}
  .btn.p{background:linear-gradient(180deg,#c8922f,#8a6317); border-color:#a97f26; color:#fff; font-weight:600}
  .btn.g{background:linear-gradient(180deg,#3f9c80,#256051); border-color:#3c8e76; color:#fff; font-weight:600}
  .btn:disabled{opacity:.38; cursor:default}
  h3{margin:2px 0 8px; font-size:13px; color:var(--gold); letter-spacing:.03em}
  .sep{height:1px; background:var(--line); margin:8px 0}
  .chip{display:inline-block; font-size:10px; padding:1px 6px; border-radius:9px; border:1px solid currentColor; font-weight:700}
  .N{color:var(--n)} .R{color:var(--r)} .SR{color:var(--sr)} .SSR{color:var(--ssr)}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .cc{background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:6px 4px; text-align:center; cursor:pointer; position:relative}
  .cc.lock{opacity:.35}
  .cc.inparty{border-color:var(--jade); box-shadow:0 0 0 1px var(--jade) inset}
  .cc .em{font-size:26px; line-height:1.1}
  .cc .nm{font-size:10px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cc .st{font-size:9px; color:var(--gold); letter-spacing:-1px}
  .bar{height:6px; background:#0d0b12; border-radius:4px; overflow:hidden; border:1px solid var(--line)}
  .bar > i{display:block; height:100%; background:var(--violet)}
  #toast{position:fixed; bottom:74px; left:50%; transform:translateX(-50%); background:#000d; color:#fff;
    padding:8px 14px; border-radius:20px; font-size:12px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:60; max-width:90%}
  #toast.on{opacity:1}
  #modal{position:fixed; inset:0; background:#000b; display:none; align-items:center; justify-content:center; z-index:70; padding:16px}
  #modal.on{display:flex}
  #mbox{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:14px; width:100%; max-width:380px; max-height:80vh; overflow-y:auto}
  .lb{display:flex; gap:6px; padding:5px 6px; border-radius:6px; font-size:12px}
  .lb.me{background:#3a2f1a; color:var(--gold); font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div id="res">
    <div class="rz"><i>🪙</i><b id="rGold">0</b></div>
    <div class="rz"><i>💠</i><b id="rGem">0</b></div>
    <div class="rz"><i>🐟</i><b id="rFish">0</b></div>
    <div class="rz"><i>🌿</i><b id="rHerb">0</b></div>
    <div class="rz"><i>⚔️</i><b id="rCp">0</b></div>
  </div>

  <div id="stage">
    <div id="stitle"><b id="sName">1층 — 안개 고개</b><span id="sSub">일반 0/10</span></div>
    <div id="timer" style="display:none">30.0</div>
    <div id="mon"><div id="monface">👺</div></div>
    <div id="hpwrap"><div id="hpbar"></div><div id="hptxt"></div></div>
    <div id="prog"></div>
    <div id="party"></div>
    <div id="btmrow">
      <button id="tap">🏏 몽둥이 후려치기</button>
      <button class="fbtn on" id="autoBtn">자동<br>진행</button>
      <button class="fbtn" id="backBtn">◀ 층</button>
    </div>
  </div>

  <div id="tabs"></div>
  <div id="panel"></div>
</div>

<div id="toast"></div>
<div id="modal"><div id="mbox"></div></div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   도깨비 소녀와 함께 — 웹 프로토타입
   원작(방치형 수집 RPG)의 핵심 루프를 역설계해 재구성한 습작.
   축: 자동전투 + 몽둥이 탭 → 골드 → 다축 강화 → 전투력 → 스테이지 게이트
   ════════════════════════════════════════════════════════════════ */

/* ── 데이터 ─────────────────────────────────────────────────── */
const RAR = {N:{k:'N',w:60,sh:20},R:{k:'R',w:28,sh:50},SR:{k:'SR',w:10,sh:120},SSR:{k:'SSR',w:2,sh:300}};

const CHARS = {
  hongi:  {n:'홍이',   e:'👹', r:'R',   t:'몽둥이', atk:14, hp:120, sk:{n:'박치기 연타', cd:6,  m:3.0}, b:null,
           d:'튜토리얼에서 몽둥이로 해방한 첫 도깨비. 성질은 급해도 의리는 있다.'},
  chorong:{n:'초롱',   e:'🦊', r:'SR',  t:'여우',   atk:26, hp:90,  sk:{n:'홀림 발톱',   cd:8,  m:5.5}, b:{t:'crit',v:.12},
           d:'꼬리 아홉을 다 세면 진다는 소문이 있다. 아무도 못 세봤다.'},
  mina:   {n:'미나',   e:'💼', r:'R',   t:'직장인', atk:11, hp:150, sk:{n:'야근 결재',   cd:7,  m:2.4}, b:{t:'gold',v:.25},
           d:'퇴근 시간에만 각성한다. 골드 수급 담당.'},
  sera:   {n:'세라',   e:'🎤', r:'SSR', t:'아이돌', atk:44, hp:130, sk:{n:'앙코르 함성', cd:10, m:8.0}, b:{t:'atkp',v:.15},
           d:'무대 위에서는 도깨비불도 조명이 된다. 파티 전체 공격력을 끌어올린다.'},
  pixel:  {n:'픽셀',   e:'🎮', r:'SR',  t:'게이머', atk:22, hp:100, sk:{n:'콤보 브레이크',cd:9, m:4.6}, b:{t:'cdr',v:.18},
           d:'프레임 단위로 논다. 파티 전원의 스킬 재사용을 앞당긴다.'},
  banya:  {n:'반야',   e:'🎭', r:'N',   t:'술래',   atk:7,  hp:90,  sk:{n:'숨바꼭질',    cd:6,  m:1.8}, b:null,
           d:'백 번을 세도 아무도 안 찾아왔다.'},
  yui:    {n:'유이',   e:'🏮', r:'N',   t:'등불',   atk:6,  hp:110, sk:{n:'등불 흔들기', cd:6,  m:1.6}, b:null,
           d:'밤길을 밝혀준다. 가끔 엉뚱한 길로 밝혀준다.'},
  musoe:  {n:'무쇠',   e:'🔨', r:'R',   t:'대장장이',atk:13, hp:170, sk:{n:'모루 내려치기',cd:8, m:2.8}, b:{t:'forge',v:.20},
           d:'강화 비용을 깎아준다. 대신 말이 없다.'},
  haseol: {n:'하설',   e:'❄️', r:'SR',  t:'설녀',   atk:24, hp:110, sk:{n:'서리 숨결',   cd:9,  m:5.0}, b:{t:'critdmg',v:.35},
           d:'입김 한 번에 계곡이 언다. 치명타 피해를 크게 올린다.'},
  yacha:  {n:'야차',   e:'😈', r:'SSR', t:'대도깨비',atk:50, hp:200, sk:{n:'파천 몽둥이',cd:12, m:11.0}, b:{t:'boss',v:.30},
           d:'대마왕과 겨뤄본 유일한 도깨비. 보스 앞에서 진가를 드러낸다.'},
};
const CIDS = Object.keys(CHARS);

const EQUIP = [
  {id:'club',  n:'몽둥이',   e:'🏏', atk:6,  hp:0,   cost:60},
  {id:'armor', n:'갑주',     e:'🥋', atk:2,  hp:40,  cost:80},
  {id:'relic', n:'신기(神器)',e:'🔮', atk:9,  hp:10,  cost:220},
  {id:'mount', n:'탈것',     e:'🐗', atk:5,  hp:60,  cost:400},
  {id:'wing',  n:'날개',     e:'🪽', atk:12, hp:30,  cost:900},
];

const FIELDS = [
  {id:'pond', n:'낚시터', e:'🎣', res:'fish', rn:'어패', base:0.20, cost:300},
  {id:'farm', n:'텃밭',   e:'🌱', res:'herb', rn:'약초', base:0.20, cost:300},
];

const ZONES = ['안개 고개','도깨비 저잣거리','달빛 대숲','귀곡 폐사지','설한 빙벽','불여우 화산','천마 협곡','루나시아 왕성'];
const MOBS  = ['👻','🐗','🦇','🕷️','🐺','🦂','🐉','💀'];

/* ── 세이브 상태 ─────────────────────────────────────────────── */
const SAVEKEY = 'dokkaebi_girl_proto_v1';
let S;
function freshState(){
  const own = {}; CIDS.forEach(id => own[id] = {have:false, star:1, sh:0, aff:0});
  own.hongi = {have:true, star:1, sh:0, aff:0};          // 튜토리얼 지급
  const eq = {}; EQUIP.forEach(e => eq[e.id] = 1);
  const fl = {}; FIELDS.forEach(f => fl[f.id] = 1);
  return {
    gold:200, gem:300, fish:0, herb:0,
    stage:1, kills:0, own, party:['hongi',null,null,null],
    equip:eq, field:fl,
    bossBest:0, bossCool:0, totalKills:0, summons:0,
    essence:0, maxStage:1, rebirths:0,
    t:Date.now(),
  };
}
function load(){
  try{
    const raw = localStorage.getItem(SAVEKEY);
    if(!raw) return freshState();
    const s = Object.assign(freshState(), JSON.parse(raw));
    CIDS.forEach(id => { if(!s.own[id]) s.own[id] = {have:false,star:1,sh:0,aff:0}; });
    return s;
  }catch(e){ return freshState(); }
}
function save(){ S.t = Date.now(); localStorage.setItem(SAVEKEY, JSON.stringify(S)); }

/* ── 유틸 ───────────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
function fmt(n){
  n = Math.floor(n);
  if(!isFinite(n)) return '∞';
  if(n >= 1e28) return n.toExponential(2);
  if(n >= 1e24) return (n/1e24).toFixed(n/1e24<100?1:0)+'자';
  if(n >= 1e20) return (n/1e20).toFixed(n/1e20<100?1:0)+'해';
  if(n >= 1e16) return (n/1e16).toFixed(n/1e16<100?1:0)+'경';
  if(n >= 1e12) return (n/1e12).toFixed(n/1e12<100?1:0)+'조';
  if(n >= 1e8)  return (n/1e8 ).toFixed(n/1e8 <100?1:0)+'억';
  if(n >= 1e4)  return (n/1e4 ).toFixed(n/1e4 <100?1:0)+'만';
  return n.toLocaleString('ko-KR');
}
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('on'), 1600);
}
function modal(html){ $('#mbox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

/* ── 스탯 계산 ──────────────────────────────────────────────── */
function charPower(id){
  const c = CHARS[id], o = S.own[id];
  const star = 1 + 0.20*(o.star-1);   // 승급: 별당 +20%
  const aff  = 1 + 0.05*o.aff;        // 호감도: 단계당 +5%
  return {atk: c.atk*star*aff, hp: c.hp*star*aff, mul: star*aff};
}
function stats(){
  let atk = 10, hp = 100, atkp = 0;
  let crit = .05, critdmg = 2.0, gold = 1, boss = 1, cdr = 0, forge = 0;
  for(const e of EQUIP){ const lv = S.equip[e.id]; atk += e.atk*lv; hp += e.hp*lv; }
  for(const id of S.party){
    if(!id || !S.own[id].have) continue;
    const p = charPower(id); atk += p.atk; hp += p.hp;
    const b = CHARS[id].b; if(!b) continue;
    const v = b.v * p.mul;                                  // 보너스도 성장에 비례
    if(b.t==='crit') crit += v; else if(b.t==='critdmg') critdmg += v;
    else if(b.t==='gold') gold += v; else if(b.t==='boss') boss += v;
    else if(b.t==='cdr') cdr += Math.min(.5, v); else if(b.t==='atkp') atkp += v;
    else if(b.t==='forge') forge += Math.min(.5, v);
  }
  atk *= (1 + atkp);
  atk *= Math.pow(1.18, S.essence);   // 환생 정수: 영구 공격력 배율(지수)
  const dps = atk * (1 + crit*(critdmg-1));
  return {atk, hp, crit, critdmg, gold, boss, cdr, forge, dps, cp: Math.floor(dps*3 + hp)};
}

/* ── 전투 수치 ──────────────────────────────────────────────── */
const isBoss   = st => st % 10 === 0;
const mobHp    = st => 60 * Math.pow(1.13, st-1) * (isBoss(st) ? 8 : 1);
const mobGold  = st => 14 * Math.pow(1.15, st-1) * (isBoss(st) ? 10 : 1);
const zoneName = st => {
  const i = Math.floor((st-1)/10);
  return i < ZONES.length ? ZONES[i] : '무저갱 ' + (i - ZONES.length + 1) + '심(深)';
};
const mobFace  = st => isBoss(st) ? '👺' : MOBS[Math.min(MOBS.length-1, Math.floor((st-1)/10))];

/* ── 런타임 전투 상태 ───────────────────────────────────────── */
let B = null;
function enterStage(){
  if(S.stage > (S.maxStage||1)) S.maxStage = S.stage;
  B = {hp: mobHp(S.stage), max: mobHp(S.stage), timer: isBoss(S.stage) ? 30 : 0, cd:{}, dead:false};
  S.party.forEach(id => { if(id) B.cd[id] = CHARS[id].sk.cd; });
  paintStage();
}
function floatText(txt, color, big){
  const host = $('#mon');
  const d = document.createElement('div');
  d.className = 'float'; d.textContent = txt;
  d.style.color = color; d.style.left = (25 + Math.random()*50) + '%';
  d.style.top = (20 + Math.random()*40) + '%';
  if(big) d.style.fontSize = '22px';
  host.appendChild(d); setTimeout(()=>d.remove(), 820);
}
function hurt(dmg, kind){
  if(!B || B.dead) return;
  const st = stats();
  if(isBoss(S.stage)) dmg *= st.boss;
  B.hp -= dmg;
  if(kind === 'tap'){ floatText(fmt(dmg), '#fff', true); $('#mon').classList.add('hit'); setTimeout(()=>$('#mon').classList.remove('hit'), 90); }
  else if(kind === 'skill') floatText(fmt(dmg), '#9b6ce0', true);
  if(B.hp <= 0){ B.hp = 0; kill(); }
}
function kill(){
  if(B.dead) return;
  B.dead = true;
  const st = stats();
  const g = mobGold(S.stage) * st.gold;
  S.gold += g; S.totalKills++;
  floatText('+' + fmt(g) + '🪙', '#e8b04b');
  if(isBoss(S.stage)){
    S.gem += 30; toast('보스 격파! 💠30 획득 — 다음 층 개방');
    if(AUTO){ S.stage++; S.kills = 0; }
  }else{
    S.kills++;
    if(S.kills >= 10){ S.kills = 0; if(AUTO) S.stage++; }   // 자동 진행 OFF면 같은 층 반복(파밍)
  }
  setTimeout(enterStage, 260);
}
function bossFail(){

/* ── 메인 루프 ──────────────────────────────────────────────── */
let last = performance.now(), acc = 0, saveAcc = 0;
function loop(now){
  const dt = Math.min(0.25, (now - last)/1000); last = now;
  const st = stats();

  if(B && !B.dead){
    hurt(st.dps * dt, 'auto');                                   // 자동 전투(초당 DPS)
    for(const id of S.party){                                     // 도깨비 스킬 자동 발동
      if(!id || !S.own[id].have || B.dead) continue;
      B.cd[id] -= dt * (1 + st.cdr);
      if(B.cd[id] <= 0){
        B.cd[id] = CHARS[id].sk.cd;
        hurt(charPower(id).atk * CHARS[id].sk.m, 'skill');
      }
    }
    if(isBoss(S.stage) && B.timer > 0){
      B.timer -= dt;
      if(B.timer <= 0 && !B.dead) bossFail();
    }
  }

  for(const f of FIELDS){                                          // 영지 자동 생산
    S[f.res] += f.base * S.field[f.id] * dt;
  }
  if(S.bossCool > 0) S.bossCool = Math.max(0, S.bossCool - dt);

  acc += dt;
  if(acc > 0.1){ acc = 0; paintLive(); }
  saveAcc += dt;
  if(saveAcc > 5){ saveAcc = 0; save(); }
  requestAnimationFrame(loop);
}

function rollRarity(){
  const tot = Object.values(RAR).reduce((a,b) => a+b.w, 0);
  let r = Math.random()*tot;
  for(const k of ['SSR','SR','R','N']){ r -= RAR[k].w; if(r <= 0) return k; }
  return 'N';
}
function summonOnce(){
  const rar = rollRarity();
  const pool = CIDS.filter(id => CHARS[id].r === rar);
  const id = pool[Math.floor(Math.random()*pool.length)];
  const o = S.own[id];
  if(o.have){ const g = Math.ceil(RAR[rar].sh/4); o.sh += g; return {id, dup:true, g}; }
  o.have = true; return {id, dup:false};
}

}
window.startBoss = () => {
  // 틱 수가 아니라 실제 경과 시간으로 계산한다 — 백그라운드 탭에서 setInterval이
  // throttle돼도 30초는 30초로 끝나야 하고, 피해량도 실제 시간에 비례해야 한다.
  WB = {t:30, dmg:0, tick:null, last:performance.now()};
  renderPanel();
  WB.tick = setInterval(() => {
    const st = stats();
    const now = performance.now();
    const dt = Math.min(1, (now - WB.last)/1000); WB.last = now;
    WB.t -= dt;
    WB.dmg += st.dps * dt * st.boss;
    const et = document.getElementById('wbT');
    if(et){ et.textContent = Math.max(0,WB.t).toFixed(1);
      document.getElementById('wbBar').style.width = Math.max(0,WB.t/30*100)+'%';
      document.getElementById('wbD').textContent = fmt(WB.dmg); }
    if(WB.t <= 0) endBoss();
  }, 100);
};
window.wbTap = () => {
  if(!WB) return;
  const st = stats();
  WB.dmg += st.atk * 2.5 * st.boss * (Math.random()<st.crit ? st.critdmg : 1);
  const f = document.getElementById('wbFace');
  if(f){ f.style.transform='scale(.9)'; setTimeout(()=>f.style.transform='', 80); }
};
function endBoss(){
  clearInterval(WB.tick);
  const dmg = WB.dmg, best = dmg > S.bossBest;
  if(best) S.bossBest = dmg;
  const gem = Math.max(20, Math.min(300, Math.floor(dmg/2000)));
  S.gem += gem; S.bossCool = 60; WB = null;
  modal(`<h3>토벌 종료</h3><div class="muted">누적 피해 <b style="color:var(--gold)">${fmt(dmg)}</b>${best?' — 신기록!':''}</div>
    <div class="sep"></div><div>보상 💠${gem}</div>
    <button class="btn p" style="width:100%;margin-top:10px" onclick="closeModal();renderPanel()">확인</button>`);
  renderPanel(); save();
}

/* ── 패널: 환생 ─────────────────────────────────────────────── */
/* 장비 강화는 DPS가 선형, 몬스터 HP는 지수라 결국 벽에 부딪힌다.
   환생은 그 벽을 영구 배율로 밀어내는 장기 성장 축이다. */
const MIN_REBIRTH = 25;
const ESS_MUL = 1.18;                                   // 정수 1개당 공격력 배율
const essenceTotal = ms => Math.floor(Math.max(0, ms - MIN_REBIRTH) * 0.6);
const essMult = n => Math.pow(ESS_MUL, n);
function panelReb(){
  const ms = Math.max(S.maxStage, S.stage);
  const gain = Math.max(0, essenceTotal(ms) - S.essence);
  const ok = ms >= MIN_REBIRTH && gain > 0;
  const nextAt = (() => { for(let s = ms+1; s < ms+400; s++) if(essenceTotal(s) > essenceTotal(ms)) return s; return '-'; })();
  return `<div class="card"><h3>환생 (轉生)</h3><div class="muted">
    도깨비들의 기억만 남기고 처음으로 돌아갑니다. ${MIN_REBIRTH}층을 넘긴 만큼 <b>도깨비 정수</b>를 얻고,
    정수 1개당 공격력이 영구히 ×${ESS_MUL} 됩니다. 층 난이도는 지수로 오르므로,
    장비 강화만으로는 언젠가 반드시 막힙니다 — 벽을 미는 유일한 축입니다.</div>
    <div class="sep"></div>
    <div class="row"><div class="grow">
      <div>보유 정수 <b style="color:var(--violet)">${S.essence}</b> → 공격력 ×${fmt(essMult(S.essence))}</div>
      <div class="muted">환생 횟수 ${S.rebirths}회 · 최고 도달 ${ms}층</div></div></div>
    <div class="sep"></div>
    <div class="row"><div class="grow">
      <div>이번 환생 획득 <b style="color:var(--gold)">정수 ${gain}</b></div>
      <div class="muted">${ms < MIN_REBIRTH ? MIN_REBIRTH+'층부터 환생할 수 있습니다'
        : '다음 정수는 ' + nextAt + '층에서'}</div></div>
      <button class="btn p" ${ok?'':'disabled'} onclick="askRebirth()">환생</button></div>
    </div>
    <div class="card"><h3>유지 / 소실</h3><div class="muted">
      <b style="color:var(--jade)">유지</b> — 도깨비 보유·승급★·호감도, 영지 레벨, 정령석💠, 정수<br>
      <b style="color:var(--red)">소실</b> — 층 진행도, 장비 강화 레벨, 골드🪙</div></div>`;
}
window.askRebirth = () => {
  const ms = Math.max(S.maxStage, S.stage);
  const gain = essenceTotal(ms) - S.essence;
  modal(`<h3>환생하시겠습니까?</h3>
    <div class="muted">${ms}층까지의 여정이 정수 ${gain}개로 갈무리됩니다.<br>
    공격력 배율 ×${fmt(essMult(S.essence))} → <b style="color:var(--gold)">×${fmt(essMult(S.essence+gain))}</b></div>
    <div class="row" style="margin-top:10px"><button class="btn grow" onclick="closeModal()">취소</button>
    <button class="btn p grow" onclick="doRebirth()">환생한다</button></div>`);
};
window.doRebirth = () => {
  const ms = Math.max(S.maxStage, S.stage);
  S.essence = essenceTotal(ms);
  S.rebirths++; S.maxStage = ms;
  S.stage = 1; S.kills = 0; S.gold = 200;
  EQUIP.forEach(e => S.equip[e.id] = 1);
  closeModal(); enterStage(); renderPanel(); save();
  toast('환생 완료 — 정수 ' + S.essence + '개, 공격력 ×' + fmt(essMult(S.essence)));
};

/* ── 렌더 라우터 ────────────────────────────────────────────── */
function renderPanel(){
  const f = {char:panelChar, forge:panelForge, summon:panelSummon, town:panelTown, boss:panelBoss, reb:panelReb}[TAB];
  const el = $('#panel'), top = el.scrollTop;
  el.innerHTML = f();
  el.scrollTop = top;
}

/* ── 방치 보상 ──────────────────────────────────────────────── */
function offlineReward(){
  const dt = Math.min(8*3600, (Date.now() - S.t)/1000);
  if(dt < 60) return;
  const st = stats();
  const stagesPerSec = st.dps / mobHp(S.stage);
  const gold = Math.min(stagesPerSec, 1.2) * mobGold(S.stage) * st.gold * dt * 0.6;
  const gem  = Math.floor(dt/600);
  let fish = 0, herb = 0;
  for(const f of FIELDS){ const v = f.base*S.field[f.id]*dt; if(f.res==='fish') fish = v; else herb = v; }
  S.gold += gold; S.gem += gem; S.fish += fish; S.herb += herb;
  const m = Math.floor(dt/60);
  modal(`<h3>방치 보상</h3><div class="muted">${Math.floor(m/60)}시간 ${m%60}분 동안 도깨비들이 대신 싸웠습니다.</div>
    <div class="sep"></div>
    <div>🪙 ${fmt(gold)}<br>💠 ${gem}<br>🐟 ${fmt(fish)}<br>🌿 ${fmt(herb)}</div>
    <button class="btn p" style="width:100%;margin-top:10px" onclick="closeModal()">받기</button>`);
}

/* ── 시작 ───────────────────────────────────────────────────── */
S = load();
offlineReward();
paintTabs(); renderPanel(); enterStage(); paintLive();
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => {
  // 탭이 숨겨지면 브라우저가 rAF를 정지시켜 전투가 멈춘다.
  // 나갈 때 시각을 남기고, 돌아왔을 때 그 공백을 방치 보상으로 정산한다.
  if(document.hidden){ save(); }
  else { last = performance.now(); offlineReward(); save(); }
});
requestAnimationFrame(loop);
</script>
</body>
</html>
